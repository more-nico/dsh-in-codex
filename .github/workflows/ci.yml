name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2
      - run: npm run check
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-in-codex-macos-node-${{ matrix.node }}
          path: |
            release/dsh-in-codex-*-macos.zip
            release/SHA256SUMS
